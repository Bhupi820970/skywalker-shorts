name: publish

# Posts every render that passed the publish gate to YouTube (Skywalker), scheduled for its IST slot.
# If the SKY_YT_CLIENT_ID / SKY_YT_CLIENT_SECRET / SKY_YT_REFRESH_TOKEN secrets exist it uploads
# directly with the YouTube Data API (scripts/yt_upload.py); otherwise it uses Buffer as before
# (scripts/buffer_post.py). Idempotent (buffer_post_id / yt_video_id in results/<id>.json).
on:
  workflow_run:
    workflows: ["render"]
    types: [completed]
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:
    inputs:
      ids:
        description: "Only these result ids (comma-separated); empty = all eligible"
        required: false
        default: ""
      dry_run:
        description: "Print what would be posted, post nothing"
        type: boolean
        default: false
      force:
        description: "Skip the >6h late-slot guard, only for ids listed in the ids input"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  buffer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Post / refresh (YouTube direct if SKY_YT_* secrets exist, else Buffer)
        id: post
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          SKY_YT_CLIENT_ID: ${{ secrets.SKY_YT_CLIENT_ID }}
          SKY_YT_CLIENT_SECRET: ${{ secrets.SKY_YT_CLIENT_SECRET }}
          SKY_YT_REFRESH_TOKEN: ${{ secrets.SKY_YT_REFRESH_TOKEN }}
          IDS: ${{ github.event.inputs.ids }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: |
          git pull --ff-only -q || true
          if [ -n "$SKY_YT_CLIENT_ID" ] && [ -n "$SKY_YT_CLIENT_SECRET" ] && [ -n "$SKY_YT_REFRESH_TOKEN" ]; then
            echo "via=youtube" >> "$GITHUB_OUTPUT"
            python3 scripts/yt_upload.py
          else
            echo "via=buffer" >> "$GITHUB_OUTPUT"
            python3 scripts/buffer_post.py
          fi
      - name: Commit publish ids
        if: always()
        run: |
          git config user.name "skywalker-publish"
          git config user.email "actions@users.noreply.github.com"
          git add results/*.json config/posted_history.json || true
          git diff --cached --quiet && exit 0
          git commit -m "publish: ${{ steps.post.outputs.via || 'buffer' }} ${{ steps.post.outputs.changed }} (run ${{ github.run_id }})"
          for i in 1 2 3 4; do git pull --rebase -q && git push && break; sleep 7; done
